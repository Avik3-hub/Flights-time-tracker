name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Ensure debug keystore exists
      run: |
        if [ ! -f app/debug.keystore ]; then
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add app/debug.keystore
          git commit -m "Add permanent debug keystore"
          git push
        fi

    - name: Build APK
      run: gradle testDebugUnitTest assembleDebug

    - name: Read application version
      id: version
      run: |
        version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
        test -n "$version"
        echo "name=$version" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v${{ steps.version.outputs.name }}-build.${{ github.run_number }}"
        name: "FlightLog ${{ steps.version.outputs.name }} (build ${{ github.run_number }})"
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
